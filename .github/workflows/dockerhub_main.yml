name: Publish image in Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  push_to_registry:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD_MAIN }}

      # Step 3: Build and push Docker image and identifier of such image
      - name: Build and push Docker image
        run: |
          COMMIT=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE=moviehubuser/movie-hub
          docker build -t $IMAGE:latest -t $IMAGE:$COMMIT -f docker/images/Dockerfile.prod .
          docker push $IMAGE:latest
          docker push $IMAGE:$COMMIT
